apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-other-test-db
  namespace: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-other-test-db
  template:
    metadata:
      labels:
        app: my-other-test-db
    spec:
      containers:
        - name: my-other-test-db-container
          image: postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "admin"
            - name: POSTGRES_DB
              value: "mydb"
      # volumes:
      #   - name: postgres-data
      #     emptyDir: {}
      # volumeMounts:
      #   - name: postgres-data
      #     mountPath: /var/lib/postgresql/data