apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-n8n-app-deployment
  namespace: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-n8n-app
  template:
    metadata:
      labels:
        app: my-n8n-app
    spec:
      containers:
      - name: my-n8n-app-container
        image: n8nio/n8n
        ports:
        - containerPort: 5678