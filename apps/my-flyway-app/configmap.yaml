apiVersion: v1
kind: ConfigMap
metadata:
  name: my-flyway-migrations
  namespace: local
data:
  V1__create_table.sql: |
    CREATE TABLE users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(50) NOT NULL,
        email VARCHAR(100) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
  V2__seed_data.sql: |
    INSERT INTO users (username, email)
    VALUES ('john_doe', 'john.doe@example.com'),
        ('jane_smith', 'jane.smith@example.com');
  V3__add_index.sql: |
    CREATE INDEX idx_users_username ON users(username);
  V4__add_age_column.sql: |
    ALTER TABLE users ADD COLUMN age INT;
  V5__update_age_column.sql: |
    UPDATE users SET age = 30 WHERE username = 'john_doe';
    UPDATE users SET age = 25 WHERE username = 'jane_smith';
  V6__add_email_unique_constraint.sql: |
    ALTER TABLE users ADD CONSTRAINT unique_email UNIQUE (email);