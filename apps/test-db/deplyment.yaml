apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-test-db
  namespace: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-test-db
  template:
    metadata:
      labels:
        app: my-test-db
    spec:
      containers:
        - name: my-test-db-container
          image: postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "admin"
            - name: POSTGRES_DB
              value: "mydb"
