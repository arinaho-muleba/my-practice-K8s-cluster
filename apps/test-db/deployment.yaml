apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-db
  namespace: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-db
  template:
    metadata:
      labels:
        app: test-db
    spec:
      containers:
      - name: test-db
        image: postgres:13
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: testdb
        - name: POSTGRES_USER
          value: testuser
        - name: POSTGRES_PASSWORD
          value: testpass
---
apiVersion: v1
kind: Service
metadata:
  name: test-db-service
  namespace: local
spec:
  selector:
    app: test-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
  type: ClusterIP